<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Nikson Shrestha</title>
  <meta name="description" content="Articles on backend engineering, Django, Spring Boot and deploying production systems." />
  <meta name="author" content="Nikson Shrestha" />
  <link rel="canonical" href="https://niksonshrestha.netlify.app/blog.html" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Blog | Nikson Shrestha" />
  <meta property="og:description" content="Articles on backend engineering, Django, Spring Boot and deploying production systems." />
  <meta property="og:url" content="https://niksonshrestha.netlify.app/blog.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a14'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='30' font-weight='bold' text-anchor='middle' fill='%230ea5e9'%3ENS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">Nikson<span>Shrestha</span></a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="blogs.html" class="active">Blog</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
  </header>

  <!-- BLOG POST -->
  <main class="blog-post-section">
    <div class="container">
      <article class="blog-post" id="blogPost">
        <div class="blog-loading">Loading article&hellip;</div>
      </article>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-wrap">
      <div class="footer-brand">
        <p class="footer-name">Nikson Shrestha</p>
        <p class="footer-role">Java &amp; Python Backend Developer &middot; Lalitpur, Nepal</p>
      </div>

      <nav class="footer-links">
        <a href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="footer-social">
        <a href="https://github.com/Nikson1122" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/nikson-shrestha-a39387213" target="_blank" rel="noopener" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:sthanikson2000@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </div>

    <div class="container footer-base">
      <p>&copy; <span id="year"></span> Nikson Shrestha. Built from scratch with HTML, CSS and JavaScript.</p>
    </div>
  </footer>

  <script src="blogs.js"></script>
  <script src="scripts.js"></script>
  <script>
    (() => {
      const id = parseInt(new URLSearchParams(location.search).get("id")) || 1;
      const blog = blogs.find((b) => b.id === id);
      const mount = document.getElementById("blogPost");

      if (!blog) {
        mount.innerHTML = `
          <div class="blog-error">
            <i class="fas fa-circle-question"></i>
            <h2>Article not found</h2>
            <p>The article you are looking for does not exist or may have been moved.</p>
            <a href="blogs.html" class="btn primary">Browse all articles</a>
          </div>`;
        return;
      }

      document.title = `${blog.title} | Nikson Shrestha`;
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", blog.excerpt);

      const mins = readingTime(blog.content);

      const hero = blog.image
        ? `<img src="${blog.image}" alt="${blog.title}" class="blog-featured-image">`
        : `<div class="blog-featured-fallback"><i class="fa-solid ${blog.icon || "fa-pen-nib"}"></i></div>`;

      const others = blogs
        .filter((b) => b.id !== blog.id)
        .slice(0, 3)
        .map(
          (b) => `
            <a class="related-card" href="blog.html?id=${b.id}">
              <span class="blog-cat">${b.category || "Article"}</span>
              <h4>${b.title}</h4>
              <span class="read-more">Read article <i class="fas fa-arrow-right"></i></span>
            </a>`
        )
        .join("");

      mount.innerHTML = `
        <nav class="crumbs">
          <a href="index.html">Home</a> <span>/</span>
          <a href="blogs.html">Blog</a> <span>/</span>
          <span class="crumb-current">${blog.category || "Article"}</span>
        </nav>

        <header class="blog-hero">
          <span class="blog-cat">${blog.category || "Article"}</span>
          <h1>${blog.title}</h1>
          <p class="blog-lead">${blog.excerpt}</p>

          <div class="blog-byline">
            <span class="byline-avatar"><img src="images/n.jpg" alt="Nikson Shrestha"></span>
            <div>
              <p class="byline-name">Nikson Shrestha</p>
              <p class="byline-meta">${blog.date} &middot; ${mins} min read</p>
            </div>
          </div>
        </header>

        ${hero}

        <div class="blog-content">${blog.content}</div>

        <footer class="blog-end">
          <div class="blog-end-cta">
            <h3>Thanks for reading</h3>
            <p>I write about backend engineering, Django, Spring Boot and shipping to production.</p>
            <div class="blog-end-actions">
              <a class="btn primary" href="contact.html"><i class="fas fa-envelope"></i> Get in touch</a>
              <a class="btn secondary" href="blogs.html">All articles</a>
            </div>
          </div>
        </footer>

        ${others ? `<section class="related"><h3>More articles</h3><div class="related-grid">${others}</div></section>` : ""}
      `;

      requestAnimationFrame(() => {
        document.querySelectorAll(".related-card").forEach((c) => c.classList.add("spotlight"));
      });
    })();
  </script>
</body>
</html>
